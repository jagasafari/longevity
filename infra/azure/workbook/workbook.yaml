workbook_version: "Notebook/1.0"
kql_item_version: "KqlItem/1.0"
resource_type: "microsoft.operationalinsights/workspaces"
schema: "https://github.com/Microsoft/Application-Insights-Workbooks/blob/master/schema/workbook.json"
queries_dir: queries
foldable_sections: true

parameters:
  - name: TimeRange
    kind: timerange
    type: 4
    required: true
    style: pills
    default_duration_ms: 86400000
    allow_custom: true
    selectable_values_ms:
      - 300000
      - 900000
      - 1800000
      - 3600000
      - 14400000
      - 43200000
      - 86400000
      - 172800000
      - 259200000
      - 604800000
      - 1209600000
      - 2419200000
      - 2592000000
      - 5184000000
      - 7776000000

  - name: Namespace
    kind: dropdown
    values:
      - longevity
    default: longevity

  - name: Container
    kind: dropdown
    multi_select: true
    values:
      - backend
      - thumbnail-worker
      - nginx
    default: backend

queries:
  - file: 09-container-logs.kql
    title: Container Logs (Filtered)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Container: "20ch"
      PodName: "35ch"
      LogEntry: "500ch"
    sort_by: TimeGenerated

  - file: 01-ingress-requests-all.kql
    title: All Incoming Requests (Ingress)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      LogEntry: "500ch"
    sort_by: TimeGenerated

  - file: 07-waf-detections.kql
    title: WAF Detections (ModSecurity)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Action: "15ch"
      RuleId: "10ch"
      RuleMessage: "200ch"
      Uri: "40ch"
      ClientIp: "15ch"
    sort_by: TimeGenerated

  - file: 02-route-split.kql
    title: Traffic Split (Frontend vs Backend)
    visualization: timechart

  - file: 03-status-codes.kql
    title: HTTP Status Code Distribution
    visualization: barchart

  - file: 04-pod-bytes-in.kql
    title: Pod Network Bytes In
    visualization: timechart

  - file: 05-pod-health.kql
    title: Pod Health Snapshot
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Name: "30ch"
      PodStatus: "15ch"
      ContainerName: "30ch"
    sort_by: TimeGenerated

  - file: 06-kube-events.kql
    title: Kubernetes Events
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Name: "20ch"
      Reason: "15ch"
      Type: "10ch"
      Message: "500ch"
    sort_by: TimeGenerated

