workbook_version: "Notebook/1.0"
kql_item_version: "KqlItem/1.0"
resource_type: "microsoft.operationalinsights/workspaces"
schema: "https://github.com/Microsoft/Application-Insights-Workbooks/blob/master/schema/workbook.json"
queries_dir: queries
foldable_sections: true

parameters:
  - name: TimeRange
    kind: timerange
    type: 4
    required: true
    style: pills
    default_duration_ms: 86400000
    allow_custom: true
    selectable_values_ms:
      - 300000
      - 900000
      - 1800000
      - 3600000
      - 14400000
      - 43200000
      - 86400000
      - 172800000
      - 259200000
      - 604800000
      - 1209600000
      - 2419200000
      - 2592000000
      - 5184000000
      - 7776000000

  - name: Namespace
    kind: dropdown
    values:
      - longevity
    default: longevity

  - name: Container
    kind: dropdown
    multi_select: true
    values:
      - photo-api
      - thumbnail-worker
      - nginx
      - redis
    default: photo-api

queries:
  - file: container-logs.kql
    title: Container Logs (Filtered)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Container: "20ch"
      PodName: "35ch"
      TraceId: "36ch"
      LogEntry: "500ch"
    sort_by: TimeGenerated

  - file: storage-blob-logs.kql
    title: Storage Blob Logs
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      ObjectKey: "60ch"
      OperationName: "20ch"
      Category: "14ch"
      AuthenticationType: "20ch"
      StatusCode: "12ch"
      StatusText: "20ch"
      CorrelationId: "40ch"
    sort_by: TimeGenerated

  - file: storage-queue-logs.kql
    title: Storage Queue Logs
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      OperationName: "20ch"
      StatusCode: "12ch"
      ObjectKey: "60ch"
    sort_by: TimeGenerated

  - file: ingress-requests-all.kql
    title: All Incoming Requests (Ingress)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Method: "8ch"
      Path: "60ch"
      Status: "8ch"
      RequestTime: "12ch"
      Upstream: "30ch"
      TraceId: "36ch"
    sort_by: TimeGenerated

  - file: waf-detections.kql
    title: WAF Detections (ModSecurity)
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Action: "15ch"
      RuleId: "10ch"
      RuleMessage: "200ch"
      Uri: "40ch"
      ClientIp: "15ch"
    sort_by: TimeGenerated

  - file: route-split.kql
    title: Traffic Split (Frontend vs Backend)
    visualization: timechart

  - file: pod-health.kql
    title: Pod Health Snapshot
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Name: "30ch"
      PodStatus: "15ch"
      ContainerName: "30ch"
    sort_by: TimeGenerated

  - file: kube-events.kql
    title: Kubernetes Events
    visualization: table
    column_formatters:
      TimeGenerated: "20ch"
      Name: "20ch"
      Reason: "15ch"
      Type: "10ch"
      Message: "500ch"
    sort_by: TimeGenerated

  - file: ingestion-cost.kql
    title: Log Analytics Ingestion (Last 30 Days)
    visualization: table
    column_formatters:
      DataType: "40ch"
      IngestedGB: "15ch"
    sort_by: IngestedGB
