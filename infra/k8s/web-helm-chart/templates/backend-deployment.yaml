apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-sa
      containers:
      - image: {{ printf "%s:%s" .Values.backend.image.repository (required "backend.image.tag is required" .Values.backend.image.tag) | quote }}
        name: backend
        ports:
        - containerPort: {{ .Values.backend.service.targetPort }}
        env:
        - name: ASPNETCORE_URLS
          value: http://+:{{ .Values.backend.service.targetPort }}
        - name: Redis__ConnectionString
          value: {{ .Values.redis.connectionString }}
        - name: Postgres__ConnectionString
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connectionString
        envFrom:
        - secretRef:
            name: oauth-secret
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.healthPath }}
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.healthPath }}
            port: {{ .Values.backend.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
