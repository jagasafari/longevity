{{- if .Values.ingress.enabled }}
{{- $rateLimit := .Values.ingress.rateLimit | default (dict "enabled" true "rps" 120 "burstMultiplier" 3 "connections" 200) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
{{- if $rateLimit.enabled }}
    # Rate limiting tuned for Blazor startup asset bursts
    nginx.ingress.kubernetes.io/limit-rps: "{{ $rateLimit.rps }}"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "{{ $rateLimit.burstMultiplier }}"
    nginx.ingress.kubernetes.io/limit-connections: "{{ $rateLimit.connections }}"
{{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: photo-api-svc
            port:
              number: {{ .Values.photoApi.service.port }}
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: photo-api-svc
            port:
              number: {{ .Values.photoApi.service.port }}
      - path: /hubs
        pathType: Prefix
        backend:
          service:
            name: photo-api-svc
            port:
              number: {{ .Values.photoApi.service.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-svc
            port:
              number: {{ .Values.web.service.port }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
