controller:
  # Pins the controller image to the exact linux/amd64 bytes for v1.14.3.
  # Prevents supply-chain tampering even if the tag is overwritten in the registry.
  # To update: docker buildx imagetools inspect registry.k8s.io/ingress-nginx/controller:<tag>
  # and copy the linux/amd64 manifest digest.
  image:
    digest: "sha256:82917be97c0939f6ada1717bb39aa7e66c229d6cfb10dcfc8f1bd42f9efe0f81"
  config:
    ssl-redirect: "true"
    # Rate limiting response codes (limits are set on Ingress annotations)
    limit-req-status-code: "429"
    limit-connections-status-code: "429"
    # ModSecurity WAF with OWASP CRS
    # Running in DetectionOnly: logs matches but does NOT block.
    # Review /var/log/modsec_audit.log for false positives before switching
    # SecRuleEngine to "On" (blocking mode).
    enable-modsecurity: "true"
    enable-owasp-modsecurity-crs: "true"
    modsecurity-snippet: |
      SecRuleEngine DetectionOnly
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecAuditLogParts ABIJDEFHZ
      # Blazor WASM loads large binaries — exclude from inspection to avoid false positives
      SecRule REQUEST_URI "@beginsWith /_framework/" "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
      # CRS rule 911100 only allows GET/HEAD/POST/OPTIONS — skip it for RESTful methods
      SecRule REQUEST_METHOD "@rx ^(PUT|PATCH|DELETE)$" "id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=911100"
    # Block known scanner/attack user agents and common attack paths
    server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      if ($http_user_agent ~* "(zgrab|masscan|nmap|shodan|censys|Go-http-client|internet-measurement|visionheight|sqlmap)" ) {
        return 403;
      }
      location ~* ^/(cgi-bin|\.git|\.github|\.svn|\.env|autodiscover|owa|actuator|SDK|wp-admin|phpmyadmin|xmlrpc) {
        return 404;
      }
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
    enableHttp: true   # required for cert-manager HTTP-01 challenge
    enableHttps: true
