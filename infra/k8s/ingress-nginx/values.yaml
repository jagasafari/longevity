controller:
  config:
    ssl-redirect: "true"
    # Rate limiting — 10 req/s per IP, burst 20, then 429
    limit-req-status-code: "429"
    limit-connections-status-code: "429"
    # ModSecurity WAF with OWASP CRS
    enable-modsecurity: "true"
    enable-owasp-modsecurity-crs: "true"
    modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecAuditLogParts ABIJDEFHZ
      # Blazor WASM loads large binaries — exclude from inspection to avoid false positives
      SecRule REQUEST_URI "@beginsWith /_framework/" "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
    # Block known scanner/attack user agents and common attack paths
    server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      if ($http_user_agent ~* "(zgrab|masscan|nmap|shodan|censys|Go-http-client|internet-measurement|visionheight|sqlmap)" ) {
        return 403;
      }
      location ~* ^/(cgi-bin|\.git|\.github|\.svn|\.env|autodiscover|owa|actuator|SDK|wp-admin|phpmyadmin|xmlrpc) {
        return 404;
      }
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
    enableHttp: true   # required for cert-manager HTTP-01 challenge
    enableHttps: true
