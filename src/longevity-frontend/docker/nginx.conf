server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://js.monitor.azure.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://*.blob.core.windows.net;
        connect-src 'self' https://*.in.applicationinsights.azure.com https://*.livediagnostics.monitor.azure.com;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
    " always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block well-known attack paths
    location ~* ^/(cgi-bin|\.git|\.github|\.svn|\.env|autodiscover|owa|actuator|SDK|wp-admin|phpmyadmin) {
        return 404;
    }
}
