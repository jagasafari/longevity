<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>longevity-frontend</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="longevity-frontend.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"
            integrity="sha384-qPpJCcLP8aZS00kKpnM+fG0k4ZEDxmt7Nz4zziDB5/UmCcEZGOjEpGBn5p/lZddU"
            crossorigin="anonymous"></script>
    <script>
        var appInsights = new Microsoft.ApplicationInsights.ApplicationInsights({
            config: {
                connectionString: "__APP_INSIGHTS_CONN_STR__",
                samplingPercentage: 100
            }
        });
        appInsights.loadAppInsights();
        appInsights.trackPageView();
        window.onerror = function (msg, url, line, col, err) {
            appInsights.trackException({ exception: err || new Error(msg) });
        };
        window.appInsights = appInsights;
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
