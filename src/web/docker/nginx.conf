server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm
        image/svg+xml;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://*.blob.core.windows.net;
        connect-src 'self';
        font-src 'self' data:;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
    " always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/(cgi-bin|\.git|\.github|\.svn|\.env|autodiscover|owa|actuator|SDK|wp-admin|phpmyadmin) {
        return 404;
    }
}
