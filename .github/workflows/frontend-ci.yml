name: Frontend CI

on:
  push:
    paths:
      - "src/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/web/**"
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/web/web.csproj

      - name: Build
        run: dotnet build src/web/web.csproj --no-restore -c Release

      - name: Publish
        run: dotnet publish src/web/web.csproj --no-build -c Release -o publish

      - name: Verify output
        run: test -f publish/wwwroot/index.html
