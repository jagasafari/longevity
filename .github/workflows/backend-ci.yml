name: Backend CI

on:
  push:
    paths:
      - "src/photo-api/**"
      - "tests/photo-api.tests/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/photo-api/**"
      - "tests/photo-api.tests/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/photo-api.tests/photo-api.tests.fsproj

      - name: Build backend
        run: dotnet build src/photo-api/photo-api.fsproj --no-restore -c Release

      - name: Build tests
        run: dotnet build tests/photo-api.tests/photo-api.tests.fsproj --no-restore -c Release

      - name: Run tests
        run: dotnet run --project tests/photo-api.tests/photo-api.tests.fsproj -c Release --no-build
