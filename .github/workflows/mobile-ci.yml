name: Mobile CI

on:
  push:
    paths:
      - "mobile/photo-sync-android/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/photo-sync-android/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: mobile/photo-sync-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        working-directory: mobile/photo-sync-android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/photo-sync-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
