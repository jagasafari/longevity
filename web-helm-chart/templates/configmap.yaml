apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.namespace }}
  # TODO: This ConfigMap will be removed once proper routing is implemented.
  # Currently using hardcoded nginx rewrite rules. 
data:
  nginx.conf: |
    server {
        
        listen 80;
        
        # Rewrite /web to / internally (no redirect)
        location /web {
            rewrite ^/web(.*)$ /$1 last;
        }
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
