server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block well-known attack paths
    location ~* ^/(cgi-bin|\.git|\.github|\.svn|\.env|autodiscover|owa|actuator|SDK|wp-admin|phpmyadmin) {
        return 404;
    }
}
